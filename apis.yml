aid: vistel
name: Vistel
description: Vistel (Beijing Zhiyuan Huitu Technology, 致远慧图) is a Beijing-based medical
  AI company founded in 2016 that applies computer vision and deep learning to ophthalmology.
  Its NMPA Class III and EU CE certified software analyzes fundus images to screen for
  diabetic retinopathy, glaucoma, and age-related macular degeneration, paired with its
  RC350 and RX350 fundus cameras and VS550 vision screener, plus telemedicine and image
  management systems. Backed by Qiming Venture Partners, Cyberport Hong Kong, and Redhill
  Capital. Vistel publishes no public developer portal or API surface.
